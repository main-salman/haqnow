#cloud-config

# Update system and install required packages
package_update: true
package_upgrade: true

packages:
  - nginx
  - certbot
  - python3-certbot-nginx
  - git
  - curl
  - wget
  - unzip
  - gzip
  - awscli
  - mysql-server
  - mysql-client
  - postgresql
  - postgresql-contrib
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - build-essential
  - tesseract-ocr
  - poppler-utils
  - libgl1-mesa-glx
  - libglib2.0-0
  - pkg-config
  - libmysqlclient-dev

# Create foi user
users:
  - name: foi
    groups: [sudo, www-data]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']

runcmd:
  # 1. Setup application directories
  - mkdir -p /opt/foi-archive/scripts
  - mkdir -p /opt/foi-archive/backend
  - mkdir -p /opt/foi-archive/frontend
  - mkdir -p /var/log/foi
  - mkdir -p /var/www/html
  - chown -R foi:foi /opt/foi-archive
  - chown -R foi:foi /var/log/foi
  - chown -R www-data:www-data /var/www/html

  # 2. Setup MySQL
  - systemctl enable mysql
  - systemctl start mysql
  - |
    mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${mysql_root_password}';"
    mysql -u root -p'${mysql_root_password}' -e "CREATE DATABASE IF NOT EXISTS ${mysql_database};"
    mysql -u root -p'${mysql_root_password}' -e "CREATE DATABASE IF NOT EXISTS defaultdb;"
    mysql -u root -p'${mysql_root_password}' -e "CREATE USER IF NOT EXISTS '${mysql_user}'@'localhost' IDENTIFIED BY '${mysql_password}';"
    mysql -u root -p'${mysql_root_password}' -e "GRANT ALL PRIVILEGES ON *.* TO '${mysql_user}'@'localhost';"
    mysql -u root -p'${mysql_root_password}' -e "FLUSH PRIVILEGES;"

  # 3. Setup PostgreSQL and install pgvector
  - systemctl enable postgresql
  - systemctl start postgresql
  - |
    # Install pgvector extension package if available via apt, or build from source
    apt-get install -y postgresql-16-pgvector || apt-get install -y postgresql-15-pgvector || apt-get install -y postgresql-14-pgvector || (
      cd /tmp && \
      git clone --depth 1 https://github.com/pgvector/pgvector.git && \
      cd pgvector && make && make install && rm -rf /tmp/pgvector
    )
    
    # Configure PostgreSQL database, user, and vector extension
    sudo -u postgres psql -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${postgres_user}') THEN CREATE ROLE ${postgres_user} LOGIN PASSWORD '${postgres_password}'; END IF; END \$\$;"
    sudo -u postgres psql -c "SELECT 'CREATE DATABASE defaultdb OWNER ${postgres_user}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'defaultdb')\gexec"
    sudo -u postgres psql -c "SELECT 'CREATE DATABASE ${postgres_database} OWNER ${postgres_user}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '${postgres_database}')\gexec"
    sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE defaultdb TO ${postgres_user};"
    sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE ${postgres_database} TO ${postgres_user};"
    sudo -u postgres psql -d defaultdb -c "CREATE EXTENSION IF NOT EXISTS vector;"
    sudo -u postgres psql -d defaultdb -c "GRANT ALL ON SCHEMA public TO ${postgres_user};"
    sudo -u postgres psql -d ${postgres_database} -c "CREATE EXTENSION IF NOT EXISTS vector;"
    sudo -u postgres psql -d ${postgres_database} -c "GRANT ALL ON SCHEMA public TO ${postgres_user};"

  # 4. Create virtualenv and install base dependencies
  - su - foi -c "python3 -m venv /opt/foi-archive/venv"
  - su - foi -c "/opt/foi-archive/venv/bin/pip install --upgrade pip"
  - su - foi -c "/opt/foi-archive/venv/bin/pip install uvicorn fastapi sqlalchemy pymysql psycopg2-binary pgvector structlog python-dotenv pydantic requests boto3"

  # 5. Create .env configuration
  - |
    cat > /opt/foi-archive/.env << 'EOF'
    # Exoscale S3 Configuration
    EXOSCALE_S3_ACCESS_KEY=${s3_access_key}
    EXOSCALE_S3_SECRET_KEY=${s3_secret_key}
    EXOSCALE_S3_ENDPOINT=${s3_endpoint}
    EXOSCALE_S3_REGION=${s3_region}
    EXOSCALE_BUCKET=${s3_bucket}
    EXOSCALE_S3_PUBLIC_URL=https://${s3_endpoint}/${s3_bucket}

    # Disaster Recovery (Vienna) Configuration
    DR_BUCKET=${dr_bucket_name}
    DR_ENDPOINT=${dr_endpoint}
    DR_REGION=at-vie-1

    # Admin Configuration
    admin_email=${admin_email}
    admin_password=${admin_password}
    UPLOAD_TIMEOUT_SECONDS=120
    JWT_SECRET_KEY=${jwt_secret}

    # Database Configuration (Local MySQL)
    MYSQL_HOST=localhost
    MYSQL_PORT=3306
    MYSQL_USER=${mysql_user}
    MYSQL_PASSWORD=${mysql_password}
    MYSQL_DATABASE=${mysql_database}
    DATABASE_URL=mysql+pymysql://${mysql_user}:${mysql_password}@localhost:3306/${mysql_database}
    DATABASE_TYPE=local

    # PostgreSQL RAG Database Configuration (Local PostgreSQL + pgvector)
    POSTGRES_RAG_URI=postgresql://${postgres_user}:${postgres_password}@localhost:5432/${postgres_database}
    POSTGRES_RAG_HOST=localhost
    POSTGRES_RAG_PORT=5432
    POSTGRES_RAG_USER=${postgres_user}
    POSTGRES_RAG_PASSWORD=${postgres_password}
    POSTGRES_RAG_DATABASE=${postgres_database}

    # Email Configuration
    SENDGRID_API_KEY=${sendgrid_api_key}
    FROM_EMAIL=noreply@fadih.org

    # Application Configuration
    HOST=0.0.0.0
    PORT=8000
    DEBUG=false
    ENVIRONMENT=${environment}
    EOF
    
    chmod 600 /opt/foi-archive/.env
    chown foi:foi /opt/foi-archive/.env

  # 6. Configure Nginx
  - |
    cat > /etc/nginx/sites-available/foi-archive << 'EOF'
    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;
        root /var/www/html;
        index index.html;

        # Frontend SPA routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Backend API
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://127.0.0.1:8000/health;
        }
    }
    EOF

  - ln -sf /etc/nginx/sites-available/foi-archive /etc/nginx/sites-enabled/
  - rm -f /etc/nginx/sites-enabled/default
  - nginx -t
  - systemctl enable nginx
  - systemctl restart nginx

  # 7. Setup Systemd Unit for FastAPI Application
  - |
    cat > /etc/systemd/system/foi-archive.service << 'EOF'
    [Unit]
    Description=HaqNow FastAPI Backend
    After=network.target mysql.service postgresql.service
    Wants=mysql.service postgresql.service

    [Service]
    Type=simple
    User=foi
    Group=foi
    WorkingDirectory=/opt/foi-archive/backend
    EnvironmentFile=/opt/foi-archive/.env
    ExecStart=/opt/foi-archive/venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000 --workers 1
    Restart=always
    RestartSec=5
    StandardOutput=journal
    StandardError=journal

    [Install]
    WantedBy=multi-user.target
    EOF

  # 8. Setup Systemd Unit for Worker
  - |
    cat > /etc/systemd/system/foi-archive-worker.service << 'EOF'
    [Unit]
    Description=HaqNow Document Processing Worker
    After=network.target mysql.service postgresql.service foi-archive.service
    Wants=foi-archive.service

    [Service]
    Type=simple
    User=foi
    Group=foi
    WorkingDirectory=/opt/foi-archive/backend
    EnvironmentFile=/opt/foi-archive/.env
    ExecStart=/opt/foi-archive/venv/bin/python worker.py
    Restart=always
    RestartSec=10
    StandardOutput=journal
    StandardError=journal

    [Install]
    WantedBy=multi-user.target
    EOF

  - systemctl daemon-reload
  - systemctl enable foi-archive
  - systemctl enable foi-archive-worker

  # 9. Automated Object Storage (SOS) Backup Script
  - |
    cat > /opt/foi-archive/scripts/backup-to-sos.sh << 'EOF'
    #!/bin/bash
    set -e

    TIMESTAMP=$(date +%Y-%m-%d-%H%M%S)
    BACKUP_TEMP_DIR="/tmp/backup-$TIMESTAMP"
    mkdir -p "$BACKUP_TEMP_DIR"

    # Load environment variables
    if [ -f "/opt/foi-archive/.env" ]; then
        set -a
        source /opt/foi-archive/.env
        set +a
    fi

    export AWS_ACCESS_KEY_ID="$EXOSCALE_S3_ACCESS_KEY"
    export AWS_SECRET_ACCESS_KEY="$EXOSCALE_S3_SECRET_KEY"
    export AWS_DEFAULT_REGION="us-east-1"

    DEST_BUCKET="$${DR_BUCKET:-foi-archive-dr}"
    DEST_ENDPOINT="$${DR_ENDPOINT:-sos-at-vie-1.exo.io}"

    echo "[$(date)] Starting local backup to Object Storage..."

    # 1. MySQL Dump
    MYSQL_DUMP="$BACKUP_TEMP_DIR/mysql-$TIMESTAMP.sql.gz"
    mysqldump -u "$MYSQL_USER" -p"$MYSQL_PASSWORD" --single-transaction --routines --triggers "$MYSQL_DATABASE" | gzip > "$MYSQL_DUMP"
    echo "[$(date)] MySQL dump created: $(du -h $MYSQL_DUMP | cut -f1)"

    # Upload MySQL dump to SOS
    aws s3 cp "$MYSQL_DUMP" "s3://$DEST_BUCKET/backups/mysql/mysql-$TIMESTAMP.sql.gz" --endpoint-url "https://$DEST_ENDPOINT"

    # 2. PostgreSQL Dump (RAG & Vectors)
    PG_DUMP="$BACKUP_TEMP_DIR/postgres-$TIMESTAMP.sql.gz"
    PGPASSWORD="$POSTGRES_RAG_PASSWORD" pg_dump -U "$POSTGRES_RAG_USER" -h localhost -p 5432 "$POSTGRES_RAG_DATABASE" | gzip > "$PG_DUMP"
    echo "[$(date)] PostgreSQL dump created: $(du -h $PG_DUMP | cut -f1)"

    # Upload PostgreSQL dump to SOS
    aws s3 cp "$PG_DUMP" "s3://$DEST_BUCKET/backups/postgres/postgres-$TIMESTAMP.sql.gz" --endpoint-url "https://$DEST_ENDPOINT"

    # Clean up local temp files
    rm -rf "$BACKUP_TEMP_DIR"

    echo "[$(date)] Backup completed and verified on Object Storage (s3://$DEST_BUCKET/backups/)"
    EOF

    chmod +x /opt/foi-archive/scripts/backup-to-sos.sh
    chown foi:foi /opt/foi-archive/scripts/backup-to-sos.sh

  # 10. Setup Cron for Automated Backups (Every 12 hours)
  - |
    cat > /etc/cron.d/haqnow-backup << 'EOF'
    0 2,14 * * * root /opt/foi-archive/scripts/backup-to-sos.sh >> /var/log/foi/backup.log 2>&1
    EOF
    chmod 644 /etc/cron.d/haqnow-backup

final_message: |
  🎉 HaqNow Standalone Low-Cost VM setup complete!
  - Local MySQL & PostgreSQL (with pgvector) configured
  - Nginx, Certbot, and Python systemd services enabled
  - Automated backups to Object Storage (SOS) scheduled twice daily